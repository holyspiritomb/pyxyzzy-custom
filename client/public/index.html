<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
    <title>pyXyzzy</title>
    <style>
        #toggle-theme:hover{cursor:pointer}
        #toggle-theme svg{
            width:32px;
            height:32px;
            vertical-align:middle;
            pointer-events:none
        }
        @keyframes spin{from{transform:rotate(0deg)}
        to{transform:rotate(360deg)}
        }
        .spin-it{
            animation-name:spin;
            animation-duration:500ms;
            animation-iteration-count:1;
            animation-timing-function:linear
        }
    </style>
  </head>
  <body>
    <script type="application/javascript">

        /*!
         * Color mode toggler for Bootstrap's docs (https://getbootstrap.com/)
         * Copyright 2011-2023 The Bootstrap Authors
         * Licensed under the Creative Commons Attribution 3.0 Unported License.
         */

        (() => {
            'use strict'

            // supported keyCodes: enter=13, space=32
            const supportedKeyCodes = [13];
            const getStoredTheme = () => localStorage.getItem('theme');
            const setStoredTheme = theme => localStorage.setItem('theme', theme);

            const getPreferredTheme = () => {
                const storedTheme = getStoredTheme();
                if (storedTheme) {
                    return storedTheme;
                }
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            };

            const getCurrTheme = () => {
                return document.documentElement.getAttribute('data-bs-theme');
            };

            const setTheme = theme => {
                if (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-bs-theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-bs-theme', theme);
                }
            };

            setTheme(getPreferredTheme());

            const showActiveTheme = (theme) => {
                const themeIcon = document.querySelector('#toggle-theme-icon use');
                if (!themeIcon) {
                    return
                }
                let icon = 'auto';
                if (theme === 'dark') { icon = 'light'; }
                if (theme === 'light') { icon = 'dark'; }
                themeIcon.setAttribute('href', `#icon-theme-${icon}`);
            }

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                const storedTheme = getStoredTheme();
                if (storedTheme !== 'light' && storedTheme !== 'dark') {
                    setTheme(getPreferredTheme());
                }
            });

            const toggleTheme = (e) => {
                if (e.type === "keyup" && supportedKeyCodes.indexOf(e.keyCode || e.which) < 0) {     // not enter key
                    return;
                }
                const newTheme = getCurrTheme() === 'dark' ? 'light' : 'dark';
                setStoredTheme(newTheme);
                setTheme(newTheme);
                const themeSvg = document.getElementById('toggle-theme-icon');
                themeSvg.addEventListener("animationend", (e) => {
                    e.target.classList.remove("spin-it");
                    showActiveTheme(newTheme);
                });
                themeSvg.classList.add("spin-it");
            };

            window.addEventListener('DOMContentLoaded', () => {
                showActiveTheme(getPreferredTheme());

                const themeToggler = document.getElementById("toggle-theme");
                if (themeToggler) {
                    themeToggler.addEventListener("click", toggleTheme);
                    themeToggler.addEventListener("keyup", toggleTheme);
                }
            });
        })();
    </script>
    <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="display:none;">
    <symbol id="icon-theme-auto" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
    <path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"></path>
    <path d="M12 3v18"></path><path d="M12 14l7 -7"></path><path d="M12 19l8.5 -8.5"></path>
    <path d="M12 9l4.5 -4.5"></path>
    </symbol>
    <symbol id="icon-theme-light" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
    <path d="M14.828 14.828a4 4 0 1 0 -5.656 -5.656a4 4 0 0 0 5.656 5.656z"></path>
    <path d="M6.343 17.657l-1.414 1.414"></path>
    <path d="M6.343 6.343l-1.414 -1.414"></path>
    <path d="M17.657 6.343l1.414 -1.414"></path>
    <path d="M17.657 17.657l1.414 1.414"></path>
    <path d="M4 12h-2"></path><path d="M12 4v-2"></path>
    <path d="M20 12h2"></path><path d="M12 20v2"></path>
    </symbol>
    <symbol id="icon-theme-dark" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
    <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"></path>
    <path d="M17 4a2 2 0 0 0 2 2a2 2 0 0 0 -2 2a2 2 0 0 0 -2 -2a2 2 0 0 0 2 -2"></path>
    <path d="M19 11h2m-1 -1v2"></path>
    </symbol>
    </svg>
    <div id="card-size-measurement"></div>
    <div id="root"></div>
    <span id="toggle-theme" tabindex="0" title="Toggle theme" style="position:absolute; z-index:9000;bottom: 24px; right:10px;">
        <svg id="toggle-theme-icon"><use href="#icon-theme-auto"></use></svg>
    </span>
  </body>
</html>
